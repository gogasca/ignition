# PR validation for examples/agentic-rl/ (the worked SDK example).
#
# Separate from pr.yaml (which is per Go component): this runs the example's
# hermetic Python suite — no GCP, no Docker build of the env image, no LLM.
# Wire a Cloud Build trigger with includedFiles:
#   examples/agentic-rl/**
#   sdks/python/**
# See deploy/PIPELINE.md "Flow 0".

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 600s

steps:
  - name: python:3.12-slim
    id: examples-agentic-rl-test
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        cd examples/agentic-rl
        pip install -q -e ../../sdks/python -e '.[dev]'
        python -m pytest -q
