# Build and push control-plane images to Artifact Registry.
# Trigger from a Cloud Build repo connection; substitute _PROJECT and _TAG.
# Promote by retagging the same digest — do not rebuild for staging/prod.

substitutions:
  _REGION: us-central1
  _AR_REPO: ignition
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/ignition-api:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/ignition-api:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/ignition-controller:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/ignition-controller:${SHORT_SHA}

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-api
    args:
      - build
      - -f
      - deploy/docker/ignition-api.Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/ignition-api:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/ignition-api:${SHORT_SHA}
      - .
  - name: gcr.io/cloud-builders/docker
    id: build-controller
    waitFor: ["-"]
    args:
      - build
      - -f
      - deploy/docker/ignition-controller.Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/ignition-controller:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/ignition-controller:${SHORT_SHA}
      - .
