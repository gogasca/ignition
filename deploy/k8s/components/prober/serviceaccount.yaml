apiVersion: v1
kind: ServiceAccount
metadata:
  name: ignition-prober
  namespace: ignition-system
  labels:
    app.kubernetes.io/part-of: ignition
    app.kubernetes.io/name: ignition-prober
# Mounts a token so the pod can reach the GKE metadata server for a Workload
# Identity ID token. The prober holds no Kubernetes RBAC.
automountServiceAccountToken: true
