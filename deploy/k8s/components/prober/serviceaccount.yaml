apiVersion: v1
kind: ServiceAccount
metadata:
  name: ignition-prober
  namespace: ignition-system
  labels:
    app.kubernetes.io/part-of: ignition
    app.kubernetes.io/name: ignition-prober
# Workload Identity ID tokens come from the GKE metadata server (pod -> KSA ->
# GSA), which does not need the projected SA token; the prober never calls the
# Kubernetes API and holds no RBAC.
automountServiceAccountToken: false
