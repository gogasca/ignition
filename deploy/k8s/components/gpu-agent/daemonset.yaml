apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ignition-gpu-agent
  namespace: ignition-system
  labels:
    app.kubernetes.io/part-of: ignition
    app.kubernetes.io/name: ignition-gpu-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ignition-gpu-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ignition
        app.kubernetes.io/name: ignition-gpu-agent
        app: ignition-gpu-agent
    spec:
      serviceAccountName: ignition-gpu-agent
      # One agent per GPU sandbox node; it must land on the tainted pool.
      nodeSelector:
        ignition.io/node-pool: gpu-sandbox-l4
      tolerations:
        - key: ignition.io/gpu-sandbox
          operator: Equal
          value: "true"
          effect: NoSchedule
        # GKE automatically taints every GKE Sandbox node with this key, and
        # every node in a GPU node pool with this one — independent of the
        # ignition.io/gpu-sandbox taint above. Without both tolerations the
        # DaemonSet's desired count is silently 0 on this pool: it schedules
        # nowhere and no GPU sandbox can ever attest.
        - key: sandbox.gke.io/runtime
          operator: Equal
          value: gvisor
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        # The agent sets ignition.io/gpu-reuse-pending itself (fail-closed at the
        # start of every reuse check) and is the ONLY thing that clears it after
        # a clean verdict. It must therefore tolerate its own fence taint — a
        # sandbox Pod deliberately does not, but an agent that cannot land on a
        # fenced node can never unfence it (DaemonSet desired count goes to 0).
        - key: ignition.io/gpu-reuse-pending
          operator: Equal
          value: "true"
          effect: NoSchedule
      # hostPID: see the node's CUDA processes for the residual-process check.
      hostPID: true
      # system-node-critical and system-cluster-critical are reserved for
      # kube-system/gke-managed-system; GKE's gcp-critical-pods quota blocks
      # them (silently, as unschedulable with 0 desired) in any other
      # namespace, including ignition-system. ignition-infra-critical (see the
      # implementation guide) is this DaemonSet's own non-reserved equivalent,
      # set above every sandbox/balloon priority so the attestation agent is
      # never preempted by tenant workloads.
      priorityClassName: ignition-infra-critical
      terminationGracePeriodSeconds: 10
      containers:
        - name: agent
          image: ignition-gpu-agent
          imagePullPolicy: IfNotPresent
          env:
            - name: IGNITION_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: IGNITION_NVIDIA_SMI
              value: /usr/local/nvidia/bin/nvidia-smi
            - name: LD_LIBRARY_PATH
              value: /usr/local/nvidia/lib64
            - name: IGNITION_GPUAGENT_INTERVAL
              value: 5s
          ports:
            - name: metrics
              containerPort: 9103
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            # Needs the host driver + /dev/nvidia* to run nvidia-smi. This is a
            # trusted system component on a dedicated, tainted pool; it requests
            # no nvidia.com/gpu and never holds a Google identity.
            privileged: true
          volumeMounts:
            - name: nvidia
              mountPath: /usr/local/nvidia
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        # GKE Container-Optimized OS installs the NVIDIA driver here.
        - name: nvidia
          hostPath:
            path: /home/kubernetes/bin/nvidia
            type: Directory
