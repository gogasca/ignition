apiVersion: apps/v1
kind: Deployment
metadata:
  name: ignition-api
  namespace: ignition-system
spec:
  template:
    spec:
      # Token is for Workload Identity → Cloud SQL Auth Proxy only. This KSA still has no Pod RBAC.
      automountServiceAccountToken: true
      containers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.15.2
          args:
            - "--structured-logs"
            - "--port=5432"
            - "PROJECT:us-central1:ignition-sql"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
