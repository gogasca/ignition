apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
components:
  # Terraform provisions Cloud SQL with ipv4_enabled=false (private network
  # only, deploy/terraform/main.tf) — the private-ip proxy variant is
  # required, the public one will never reach the instance.
  - ../../components/cloud-sql-proxy-private
images:
  - name: ignition-api
    newName: us-central1-docker.pkg.dev/PROJECT/ignition/ignition-api
    newTag: sample
  - name: ignition-controller
    newName: us-central1-docker.pkg.dev/PROJECT/ignition/ignition-controller
    newTag: sample
  - name: ignition-gateway
    newName: us-central1-docker.pkg.dev/PROJECT/ignition/ignition-gateway
    newTag: sample
patches:
  - path: replicas.yaml
  - path: config.yaml
  - path: serviceaccount-wi.yaml
  - path: cloud-sql-instance.yaml
