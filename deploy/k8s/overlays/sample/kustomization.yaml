apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
components:
  - ../../components/cloud-sql-proxy
images:
  - name: ignition-api
    newName: us-central1-docker.pkg.dev/PROJECT/ignition/ignition-api
    newTag: sample
  - name: ignition-controller
    newName: us-central1-docker.pkg.dev/PROJECT/ignition/ignition-controller
    newTag: sample
patches:
  - path: replicas.yaml
  - path: config.yaml
  - path: serviceaccount-wi.yaml
  - path: cloud-sql-instance.yaml
