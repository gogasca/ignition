apiVersion: v1
kind: ConfigMap
metadata:
  name: ignition-api
  namespace: ignition-system
data:
  IGNITION_ENV: "staging"
  IGNITION_GCP_PROJECT: "anyscale-demo"
  # No public DNS: the audience is a fixed opaque string the prober also
  # requests. The gcloud client id is accepted too so an operator's own
  # `gcloud auth print-identity-token` works without SA impersonation.
  IGNITION_OIDC_AUDIENCE: "https://api.anyscale-demo.ignition.dev"
  IGNITION_OIDC_AUDIENCES: "32555940559.apps.googleusercontent.com"
  # Node egress is Google-only via Private Google Access. accounts.google.com
  # (OIDC discovery) is not on that path; www.googleapis.com is. Pin JWKS
  # directly so the verifier never needs the discovery document.
  IGNITION_OIDC_JWKS_URL: "https://www.googleapis.com/oauth2/v3/certs"
  IGNITION_GATEWAY_URL: "https://gateway.anyscale-demo.ignition.dev"
  IGNITION_MAX_ACTIVE_SANDBOXES: "5"
  # Seed the first owner on startup (idempotent once an owner exists).
  IGNITION_BOOTSTRAP_PROJECT: "prj_dev"
  IGNITION_BOOTSTRAP_ADMIN: "gascagonzalo@gmail.com"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ignition-controller
  namespace: ignition-system
data:
  IGNITION_ENV: "staging"
  IGNITION_GCP_PROJECT: "anyscale-demo"
  IGNITION_SANDBOX_IMAGE_PREFIX: "us-central1-docker.pkg.dev/anyscale-demo/sandboxes"
  IGNITION_MIN_WARM: "0"
  IGNITION_MAX_WARM: "0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ignition-prober
  namespace: ignition-system
data:
  IGNITION_PROBE_PROJECT: "prj_dev"
  IGNITION_PROBE_AUDIENCE: "https://api.anyscale-demo.ignition.dev"
  # Read-only journeys: health, auth-guard, default-runtime, list. These
  # exercise the full OIDC verification + RBAC without needing a sandbox
  # node pool or a seeded image. Switch to "full" once img_seed is pushed.
  IGNITION_PROBE_JOURNEYS: "lite"
