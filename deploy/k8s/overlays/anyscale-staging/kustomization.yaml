# Staging-grade deployment on GCP project anyscale-demo, reached by
# `kubectl port-forward` (no public Ingress / IAP - the project has no public
# DNS zone). IGNITION_ENV=staging keeps the full fail-closed validation and the
# real OIDC path; there is no IGNITION_DEV_BEARER.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../components/cloud-sql-proxy-private
  - ../../components/prober
images:
  - name: ignition-api
    newName: us-central1-docker.pkg.dev/anyscale-demo/ignition/ignition-api
    newTag: staging
  - name: ignition-controller
    newName: us-central1-docker.pkg.dev/anyscale-demo/ignition/ignition-controller
    newTag: staging
  - name: ignition-prober
    newName: us-central1-docker.pkg.dev/anyscale-demo/ignition/ignition-prober
    newTag: staging
patches:
  - path: replicas.yaml
  - path: config.yaml
  - path: serviceaccount-wi.yaml
  - path: cloud-sql-instance.yaml
