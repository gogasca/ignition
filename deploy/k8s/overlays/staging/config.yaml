apiVersion: v1
kind: ConfigMap
metadata:
  name: ignition-api
  namespace: ignition-system
data:
  IGNITION_ENV: "staging"
  IGNITION_OIDC_AUDIENCE: "https://api.staging.ignition.dev"
  IGNITION_GATEWAY_URL: "https://gateway.staging.ignition.dev"
  IGNITION_MAX_ACTIVE_SANDBOXES: "20"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ignition-controller
  namespace: ignition-system
data:
  IGNITION_ENV: "staging"
  IGNITION_GCP_PROJECT: "ignition-staging"
  IGNITION_SANDBOX_IMAGE_PREFIX: "us-central1-docker.pkg.dev/ignition-staging/sandboxes"
  # base sets MIN_WARM=1, which pins a balloon Pod and keeps the g2-standard-8 +
  # L4 pool from scaling to zero. Staging does not need a standing warm pool;
  # raise this only while exercising warm-pool behaviour.
  IGNITION_MIN_WARM: "0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ignition-prober
  namespace: ignition-system
data:
  # Must equal the ignition-api ConfigMap's IGNITION_OIDC_AUDIENCE above.
  IGNITION_PROBE_AUDIENCE: "https://api.staging.ignition.dev"
