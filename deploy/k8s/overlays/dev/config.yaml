apiVersion: v1
kind: ConfigMap
metadata:
  name: ignition-api
  namespace: ignition-system
data:
  IGNITION_ENV: "dev"
  IGNITION_OIDC_AUDIENCE: "https://api.dev.ignition.dev"
  IGNITION_GATEWAY_URL: "https://gateway.dev.ignition.dev"
  IGNITION_MAX_ACTIVE_SANDBOXES: "5"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ignition-controller
  namespace: ignition-system
data:
  IGNITION_ENV: "dev"
  IGNITION_MIN_WARM: "0"
  IGNITION_MAX_WARM: "0"
  IGNITION_SANDBOX_IMAGE_PREFIX: "us-central1-docker.pkg.dev/ignition-dev/sandboxes"
