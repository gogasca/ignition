apiVersion: v1
kind: ConfigMap
metadata:
  name: ignition-controller
  namespace: ignition-system
  labels:
    app.kubernetes.io/part-of: ignition
    app.kubernetes.io/name: ignition-controller
data:
  IGNITION_REGION: "us-central1"
  IGNITION_K8S_NAMESPACE: "ignition-sandboxes"
  IGNITION_MIN_WARM: "1"
  IGNITION_MAX_WARM: "8"
  IGNITION_SANDBOX_IMAGE_PREFIX: "us-central1-docker.pkg.dev/ignition-dev/sandboxes"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ignition-controller
  namespace: ignition-system
  labels:
    app.kubernetes.io/part-of: ignition
    app.kubernetes.io/name: ignition-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ignition-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ignition
        app.kubernetes.io/name: ignition-controller
        app: ignition-controller
    spec:
      serviceAccountName: ignition-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ignition-controller
      containers:
        - name: controller
          image: ignition-controller
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ignition-controller
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ignition-control-plane
                  key: DATABASE_URL
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ignition-controller
  namespace: ignition-system
  labels:
    app.kubernetes.io/part-of: ignition
    app.kubernetes.io/name: ignition-controller
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ignition-controller
