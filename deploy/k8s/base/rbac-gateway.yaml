# ignition-gateway resolves a sandbox to its Pod by the ignition.io/sandbox-id
# label. Sandboxes may live in per-project namespaces, so this is cluster-wide
# read-only Pod access and nothing else. The gateway holds no database access
# and never mutates cluster state.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ignition-gateway-sandbox-lookup
  labels:
    app.kubernetes.io/part-of: ignition
    app.kubernetes.io/name: ignition-gateway
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ignition-gateway-sandbox-lookup
  labels:
    app.kubernetes.io/part-of: ignition
    app.kubernetes.io/name: ignition-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ignition-gateway-sandbox-lookup
subjects:
  - kind: ServiceAccount
    name: ignition-gateway
    namespace: ignition-system
