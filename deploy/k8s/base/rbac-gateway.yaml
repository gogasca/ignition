# ignition-gateway resolves a sandbox to its Pod by the ignition.io/sandbox-id
# label. Read-only Pod list in the sandbox namespace, nothing else. The gateway
# holds no database access and never mutates cluster state.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ignition-gateway-sandbox-lookup
  namespace: ignition-sandboxes
  labels:
    app.kubernetes.io/part-of: ignition
    app.kubernetes.io/name: ignition-gateway
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ignition-gateway-sandbox-lookup
  namespace: ignition-sandboxes
  labels:
    app.kubernetes.io/part-of: ignition
    app.kubernetes.io/name: ignition-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ignition-gateway-sandbox-lookup
subjects:
  - kind: ServiceAccount
    name: ignition-gateway
    namespace: ignition-system
