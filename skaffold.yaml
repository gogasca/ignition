# Render/deploy source for Google Cloud Deploy. Not used for local development.
# Cloud Deploy renders deploy/k8s/overlays/staging with kustomize and overrides
# the `ignition-api` / `ignition-controller` / `ignition-prober` image names via
# `releases create --images`.
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: ignition
manifests:
  kustomize:
    paths:
      - deploy/k8s/overlays/staging
deploy:
  kubectl: {}
verify:
  # Post-deploy gate: run the credential-free critical-user-journeys (health,
  # auth-guard) once against the freshly rolled API. These are the only journeys
  # valid without a bearer — "lite" also contains default-runtime and list,
  # which call authenticated routes and 401 under IGNITION_PROBE_AUTH=none. The
  # authenticated read-only and lifecycle journeys are covered continuously by
  # the in-cluster ignition-prober Deployment (Workload Identity token) and by
  # tests/integration in CI. To run more here, give this Job the
  # ignition-prober ServiceAccount + IGNITION_PROBE_AUTH=gcp-idtoken +
  # IGNITION_PROBE_AUDIENCE=<the API's IGNITION_OIDC_AUDIENCE>.
  - name: cuj-smoke
    container:
      name: cuj-smoke
      image: ignition-prober
      env:
        - name: IGNITION_PROBE_TARGET
          value: http://ignition-api.ignition-system:8080
        - name: IGNITION_PROBE_ONESHOT
          value: "true"
        - name: IGNITION_PROBE_JOURNEYS
          value: smoke
        - name: IGNITION_PROBE_AUTH
          value: none
    executionMode:
      # Run as an in-cluster Job so it can reach the private ClusterIP.
      kubernetesCluster: {}
profiles:
  - name: staging
    manifests:
      kustomize:
        paths:
          - deploy/k8s/overlays/staging
