syntax = "proto3";

package ignition.v1;

option go_package = "ignition.dev/ignition/api/gen/ignition/v1;ignitionv1";

import "google/protobuf/timestamp.proto";
import "ignition/v1/common.proto";
import "ignition/v1/operation.proto";

// Isolated sandbox (GPU or CPU-only, per resources.accelerator). Public states:
// CREATING → SCHEDULED → STARTED → READY → TERMINATING → FINISHED
// any nonterminal → FAILED
//
// RPCs: sandbox_service.proto (SandboxService). Process messages: process.proto.
message Sandbox {
  string id = 1;
  string project_id = 2;
  string name = 3;
  SandboxState state = 4;
  // Machine-readable reason, e.g. ADMITTED, CAPACITY_UNAVAILABLE.
  string state_reason = 5;
  string image_id = 6;
  string operation_id = 7;
  google.protobuf.Timestamp create_time = 9;
  google.protobuf.Timestamp ready_time = 10;
  google.protobuf.Timestamp finish_time = 11;
  ResourceSpec resources = 12;
  PlacementSpec placement = 13;
  TimeoutSpec timeouts = 14;
  NetworkSpec network = 15;
  map<string, string> labels = 16;
  Status error = 17;
}

enum SandboxState {
  SANDBOX_STATE_UNSPECIFIED = 0;
  SANDBOX_STATE_CREATING = 1;
  SANDBOX_STATE_SCHEDULED = 2;
  SANDBOX_STATE_STARTED = 3;
  SANDBOX_STATE_READY = 4;
  SANDBOX_STATE_TERMINATING = 5;
  SANDBOX_STATE_FINISHED = 6;
  SANDBOX_STATE_FAILED = 7;
}

message ResourceSpec {
  int32 cpu_milli = 1;
  int32 memory_mib = 2;
  reserved 3;
  reserved "gpu";
  AcceleratorSpec accelerator = 4;
}

message AcceleratorSpec {
  // NONE: 0. NVIDIA_L4: exactly 1.
  int32 count = 1;
  AcceleratorType type = 2;
}

// Public JSON drops the prefix: ACCELERATOR_TYPE_NVIDIA_L4 → "NVIDIA_L4".
// NONE is a CPU-only sandbox.
enum AcceleratorType {
  ACCELERATOR_TYPE_UNSPECIFIED = 0;
  ACCELERATOR_TYPE_NONE = 1;
  ACCELERATOR_TYPE_NVIDIA_L4 = 2;
}

message PlacementSpec {
  string region = 1;
  ComputeEnvironment compute_environment = 2;
}

// Public HTTP JSON drops the prefix: COMPUTE_ENVIRONMENT_STANDARD → "STANDARD".
enum ComputeEnvironment {
  COMPUTE_ENVIRONMENT_UNSPECIFIED = 0;
  COMPUTE_ENVIRONMENT_STANDARD = 1;
  COMPUTE_ENVIRONMENT_BARE_METAL = 2;
}

message TimeoutSpec {
  int32 startup_seconds = 1;
  int32 maximum_runtime_seconds = 2;
  int32 idle_seconds = 3;
  int32 termination_grace_seconds = 4;
}

message NetworkSpec {
  // Controls outbound access to the public internet. This does not expose the
  // sandbox to inbound traffic or grant access to private control networks.
  InternetAccess internet_access = 1;
}

// Public HTTP JSON drops the prefix: INTERNET_ACCESS_DISABLED → "DISABLED".
enum InternetAccess {
  INTERNET_ACCESS_UNSPECIFIED = 0;
  INTERNET_ACCESS_DISABLED = 1;
  INTERNET_ACCESS_ENABLED = 2;
}

message SecretRef {
  string secret_id = 1;
  string version = 2;
  string environment_name = 3;
}

message CreateSandboxRequest {
  string project_id = 1;
  string name = 3;
  string image_id = 4;
  repeated string command = 5;
  string working_directory = 6;
  repeated SecretRef secret_refs = 8;
  ResourceSpec resources = 9;
  PlacementSpec placement = 10;
  TimeoutSpec timeouts = 11;
  NetworkSpec network = 12;
  map<string, string> labels = 14;
}

message CreateSandboxResponse {
  Sandbox sandbox = 1;
  Operation operation = 2;
}

message GetSandboxRequest {
  string project_id = 1;
  string sandbox_id = 2;
}

message ListSandboxesRequest {
  string project_id = 1;
  PageRequest page = 2;
  string filter = 3;
}

message ListSandboxesResponse {
  repeated Sandbox sandboxes = 1;
  PageResponse page = 2;
}

message TerminateSandboxRequest {
  string project_id = 1;
  string sandbox_id = 2;
}

message TerminateSandboxResponse {
  Sandbox sandbox = 1;
  Operation operation = 2;
}

message WatchSandboxRequest {
  string project_id = 1;
  string sandbox_id = 2;
  string last_event_id = 3;
}
