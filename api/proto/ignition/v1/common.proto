syntax = "proto3";

package ignition.v1;

option go_package = "ignition.dev/ignition/api/gen/ignition/v1;ignitionv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Cursor pagination. List APIs order by (create_time, id).
message PageRequest {
  // Maximum items to return. Server-capped.
  int32 page_size = 1;
  // Opaque cursor from a previous List response.
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
}

// Stable API error. HTTP/gRPC transport codes are derived from `code`.
message Status {
  ErrorCode code = 1;
  string message = 2;
  string request_id = 3;
  bool retryable = 4;
  int32 retry_after_seconds = 5;
  google.protobuf.Struct details = 6;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_IDEMPOTENCY_KEY_REUSED = 5;
  ERROR_CODE_IDEMPOTENCY_IN_PROGRESS = 6;
  ERROR_CODE_IMAGE_NOT_READY = 7;
  ERROR_CODE_WORKLOAD_NOT_SUPPORTED = 8;
  ERROR_CODE_QUOTA_EXCEEDED = 9;
  ERROR_CODE_RATE_LIMITED = 10;
  ERROR_CODE_CAPACITY_UNAVAILABLE = 11;
  ERROR_CODE_UNAVAILABLE = 12;
  ERROR_CODE_FAILED_PRECONDITION = 13;
  ERROR_CODE_ABORTED = 14;
  ERROR_CODE_DEADLINE_EXCEEDED = 15;
}

// Idempotency-Key is required on every create and retriable mutation.
// REST maps this to the Idempotency-Key header; gRPC sends it as a field.
message Idempotency {
  string key = 1;
}

message LifecycleTimestamps {
  google.protobuf.Timestamp create_time = 1;
  google.protobuf.Timestamp update_time = 2;
  google.protobuf.Timestamp delete_time = 3;
}
