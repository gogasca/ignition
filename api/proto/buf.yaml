version: v2
modules:
  - path: .
    name: buf.build/ignition/api
lint:
  use:
    - STANDARD
  except:
    # AIP-style Get/Create/Watch return the resource or a dedicated response.
    # Reusing the resource for Get, Watch, and mutations preserves the public
    # HTTP/JSON body instead of adding RPC-specific response envelopes.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  # The public contract is checked for wire and JSON compatibility.
  use:
    - WIRE_JSON
