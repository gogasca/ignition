[project]
name = "swe-mini-rl"
version = "0.1.0"
description = "Agentic RL (RLVR) on Ignition sandboxes — a worked example on a small code-fix task family"
readme = "README.md"
requires-python = ">=3.11"
# The harness, tasks, policy adapters, trainer, and tests are standard-library
# only. The driver (controller / topology-B loop) needs the Ignition Python SDK,
# which lives in this repo at sdks/python — install it alongside this package:
#
#   pip install -e ../../sdks/python -e '.[dev]'      (or: make venv)
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ignition-sandbox"]
# The real GRPO step (swe_mini/trainer/grpo_trl.py). Needs a GPU + a vLLM
# endpoint at INFERENCE_URL; see docs/guides/agentic-rl-example.md.
train = ["torch", "transformers", "trl>=1.0", "datasets"]

[tool.uv.sources]
ignition-sandbox = { path = "../../sdks/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swe_mini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
