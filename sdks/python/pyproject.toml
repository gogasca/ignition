[project]
name = "ignition-sandbox"
version = "0.1.0"
description = "Python SDK for Ignition sandboxes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "websockets>=12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ignition_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
